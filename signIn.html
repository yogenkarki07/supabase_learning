<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-in page</title>
</head>
<body>
    <h1> Welcome to Sign-In page </h1>

    <label for="email"> Email: </label>

</body>
</html>
