<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign-in page</title>
    <link rel="stylesheet" href="signin.css" />
    <!-- 1. Fetch the library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  </head>
  <body>
    <h1>Welcome to Supabase (Auth) </h1>

    <section class="status">
      <h3>Status: <span> ? </span></h3>
      <h3 class="email"></h3>
    </section>

    <!-- SIGN-IN SECTION -->
    <section id="sign-in-section"  class="sign-in-section">
      <h2>Sign In</h2>
      <label for="email"> Email </label> <br />
      <input
        type="email"
        id="email"
        class="sign-in"
        placeholder=" abc@gmail.com"
      />
      <br /><br />

      <label for="password"> Password </label> <br />
      <input
        type="password"
        id="password"
        class="sign-in"
        placeholder=" Enter your password"
      />
      <br /><br />

      <button onclick="handleSignIn()" id="submit" class="button">Login</button>
      <button onclick="logOut()" class="button">Cancel</button>

      <p class="create-account">New here? <a href="#" onclick="toggleForms(event)"> Create an account</a></p>
    </section>

    <!-- SIGN-UP SECTION (Initially Hidden) -->
    <section id="sign-up-section" class="sign-up-form" style="display: none">
      <h2>Create an Account</h2>
      <label for="signup-email">Email</label><br />
      <input
        type="email"
        id="signup-email"
        class="sign-in"
        placeholder="abc@gmail.com"
      /><br /><br />

      <label for="signup-password">Password</label><br />
      <input
        type="password"
        id="signup-password"
        class="sign-in"
        placeholder="Enter your password"
      /><br /><br />

      <button id="signup-submit" class="button" onclick="handleSignUp()">
        Sign Up
      </button>
      <button onclick="toggleForms(event)" class="button">Cancel</button>

      <p class="create-account">
         Already have an account?
        <a href="#" onclick="toggleForms(event)"> Sign In </a>
      </p>
    </section>
